<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Expense Analyzer</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            min-height: 100vh;

            color: #1e293b;

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(99, 102, 241, 0.20),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 90% 20%,
                    rgba(236, 72, 153, 0.18),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 50% 100%,
                    rgba(14, 165, 233, 0.18),
                    transparent 35%
                ),

                linear-gradient(
                    135deg,
                    #eef2ff,
                    #f8fafc,
                    #fdf2f8
                );

            overflow-x: hidden;
        }


        /* Background decoration */

        body::before {

            content: "";

            position: fixed;

            width: 300px;
            height: 300px;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #6366f1,
                    #a855f7
                );

            opacity: 0.08;

            top: 120px;
            left: -120px;

            filter: blur(10px);

            z-index: -1;

        }


        body::after {

            content: "";

            position: fixed;

            width: 350px;
            height: 350px;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #ec4899,
                    #f97316
                );

            opacity: 0.07;

            bottom: -150px;
            right: -100px;

            filter: blur(10px);

            z-index: -1;

        }


        .container {

            width: 92%;

            max-width: 1250px;

            margin: auto;

            padding:
                40px 0 60px;

        }


        /* Header */

        .header {

            margin-bottom: 32px;

            animation:
                fadeDown 0.7s ease;

        }


        .header h1 {

            font-size: 36px;

            font-weight: 750;

            letter-spacing: -1px;

            background:
                linear-gradient(
                    90deg,
                    #4f46e5,
                    #9333ea,
                    #db2777
                );

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;

            margin-bottom: 8px;

        }


        .header p {

            color: #64748b;

            font-size: 15px;

        }


        /* General cards */

        .card,
        .chart-card,
        .insight-card {

            background:
                rgba(255, 255, 255, 0.72);

            backdrop-filter:
                blur(18px);

            -webkit-backdrop-filter:
                blur(18px);

            border:
                1px solid
                rgba(255, 255, 255, 0.8);

            box-shadow:
                0 15px 40px
                rgba(51, 65, 85, 0.08);

            border-radius: 20px;

        }


        .card {

            padding: 25px;

            margin-bottom: 22px;

        }


        .card h2,
        .chart-card h2 {

            font-size: 18px;

            color: #1e293b;

            margin-bottom: 20px;

        }


        /* Add Expense */

        .expense-form {

            display: grid;

            grid-template-columns:
                1.3fr
                1fr
                1fr
                1fr
                auto;

            gap: 12px;

        }


        input {

            width: 100%;

            padding:
                13px 15px;

            background:
                rgba(248, 250, 252, 0.9);

            border:
                1px solid #e2e8f0;

            border-radius: 11px;

            color: #1e293b;

            outline: none;

            font-size: 14px;

            transition:
                0.25s ease;

        }


        input:focus {

            border-color:
                #818cf8;

            box-shadow:
                0 0 0 4px
                rgba(99, 102, 241, 0.10);

            background: white;

        }


        input::placeholder {

            color: #94a3b8;

        }


        /* Buttons */

        button {

            border: none;

            border-radius: 11px;

            padding:
                12px 18px;

            cursor: pointer;

            font-size: 14px;

            font-weight: 650;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;

        }


        button:hover {

            transform:
                translateY(-2px);

        }


        .add-btn {

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #4f46e5,
                    #9333ea
                );

            box-shadow:
                0 8px 20px
                rgba(99, 102, 241, 0.25);

        }


        .add-btn:hover {

            box-shadow:
                0 12px 25px
                rgba(99, 102, 241, 0.35);

        }


        /* Total */

        .total-card {

            position: relative;

            overflow: hidden;

            padding: 28px;

        }


        .total-card::after {

            content: "";

            position: absolute;

            width: 150px;
            height: 150px;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #6366f1,
                    #ec4899
                );

            opacity: 0.10;

            right: -40px;
            top: -60px;

        }


        .total-label {

            color: #64748b;

            font-size: 14px;

            margin-bottom: 5px;

        }


        .total-value {

            font-size: 36px;

            font-weight: 750;

            color: #1e293b;

        }


        /* Insights */

        .insights {

            display:
                grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 17px;

            margin-bottom: 25px;

        }


        .insight-card {

            padding: 21px;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;

        }


        .insight-card:hover {

            transform:
                translateY(-5px);

            box-shadow:
                0 20px 35px
                rgba(51, 65, 85, 0.12);

        }


        .insight-card:nth-child(1) {

            border-top:
                3px solid #6366f1;

        }


        .insight-card:nth-child(2) {

            border-top:
                3px solid #0ea5e9;

        }


        .insight-card:nth-child(3) {

            border-top:
                3px solid #f97316;

        }


        .insight-card:nth-child(4) {

            border-top:
                3px solid #ec4899;

        }


        .insight-title {

            color: #64748b;

            font-size: 13px;

            margin-bottom: 9px;

        }


        .insight-value {

            color: #1e293b;

            font-size: 22px;

            font-weight: 700;

        }


        /* Charts */

        .charts {

            display:
                grid;

            grid-template-columns:
                1fr 1fr;

            gap: 20px;

            margin-bottom: 25px;

        }


        .chart-card {

            padding: 25px;

            height: 400px;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;

        }


        .chart-card:hover {

            transform:
                translateY(-4px);

            box-shadow:
                0 20px 45px
                rgba(51, 65, 85, 0.12);

        }


        .chart-container {

            position: relative;

            width: 100%;

            height: 310px;

        }


        /* Expense table */

        .expense-table {

            width: 100%;

            border-collapse:
                separate;

            border-spacing: 0;

        }


        .expense-table th {

            text-align: left;

            color: #64748b;

            font-size: 12px;

            font-weight: 600;

            text-transform:
                uppercase;

            letter-spacing:
                0.5px;

            padding:
                13px 12px;

            border-bottom:
                1px solid #e2e8f0;

        }


        .expense-table td {

            padding:
                15px 12px;

            border-bottom:
                1px solid #f1f5f9;

            font-size: 14px;

            color: #334155;

        }


        .expense-table tr {

            transition:
                background 0.2s ease;

        }


        .expense-table tbody tr:hover {

            background:
                rgba(99, 102, 241, 0.04);

        }


        .expense-table tr:last-child td {

            border-bottom: none;

        }


        .amount {

            font-weight: 700;

            color: #1e293b;

        }


        .category {

            display: inline-block;

            padding:
                5px 10px;

            border-radius:
                20px;

            background:
                #eef2ff;

            color:
                #4f46e5;

            font-size: 12px;

            font-weight: 600;

        }


        .delete-btn {

            background:
                #fff1f2;

            color:
                #e11d48;

            padding:
                7px 12px;

            font-size: 12px;

        }


        .delete-btn:hover {

            background:
                #ffe4e6;

            box-shadow:
                0 5px 12px
                rgba(225, 29, 72, 0.12);

        }


        /* Animation */

        @keyframes fadeDown {

            from {

                opacity: 0;

                transform:
                    translateY(-12px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }


        /* Responsive */

        @media (max-width: 1000px) {

            .expense-form {

                grid-template-columns:
                    1fr 1fr;

            }

            .insights {

                grid-template-columns:
                    1fr 1fr;

            }

            .charts {

                grid-template-columns:
                    1fr;

            }

        }


        @media (max-width: 600px) {

            .container {

                width: 94%;

                padding-top: 25px;

            }


            .header h1 {

                font-size: 28px;

            }


            .expense-form {

                grid-template-columns:
                    1fr;

            }


            .insights {

                grid-template-columns:
                    1fr;

            }


            .chart-card {

                height: 370px;

            }


            .chart-container {

                height: 285px;

            }


            .expense-table {

                font-size: 12px;

            }


            .expense-table th,
            .expense-table td {

                padding:
                    10px 6px;

            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- Header -->

    <div class="header">

        <h1>Smart Expense Analyzer</h1>

        <p>
            Track, analyze and understand your spending.
        </p>

    </div>


    <!-- Add Expense -->

    <div class="card">

        <h2>Add Expense</h2>

        <form
            id="expense-form"
            class="expense-form"
        >

            <input
                type="text"
                id="title"
                placeholder="Expense title"
                required
            >

            <input
                type="number"
                id="amount"
                placeholder="Amount"
                required
            >

            <input
                type="text"
                id="category"
                placeholder="Category"
                required
            >

            <input
                type="date"
                id="expense-date"
                required
            >

            <button
                type="submit"
                class="add-btn"
            >
                Add Expense
            </button>

        </form>

    </div>


    <!-- Total -->

    <div class="card total-card">

        <div>

            <div class="total-label">
                Total Spending
            </div>

            <div
                class="total-value"
                id="total-spending"
            >
                ₹0
            </div>

        </div>

    </div>


    <!-- Insights -->

    <div class="insights">


        <div class="insight-card">

            <div class="insight-title">
                Number of Expenses
            </div>

            <div
                class="insight-value"
                id="expense-count"
            >
                0
            </div>

        </div>


        <div class="insight-card">

            <div class="insight-title">
                Average Expense
            </div>

            <div
                class="insight-value"
                id="average-expense"
            >
                ₹0
            </div>

        </div>


        <div class="insight-card">

            <div class="insight-title">
                Highest Expense
            </div>

            <div
                class="insight-value"
                id="highest-expense"
            >
                ₹0
            </div>

        </div>


        <div class="insight-card">

            <div class="insight-title">
                Top Category
            </div>

            <div
                class="insight-value"
                id="top-category"
            >
                -
            </div>

        </div>


    </div>


    <!-- Charts -->

    <div class="charts">


        <div class="chart-card">

            <h2>Spending by Category</h2>

            <div class="chart-container">

                <canvas
                    id="category-chart"
                ></canvas>

            </div>

        </div>


        <div class="chart-card">

            <h2>Monthly Spending</h2>

            <div class="chart-container">

                <canvas
                    id="monthly-chart"
                ></canvas>

            </div>

        </div>


    </div>


    <!-- Expenses -->

    <div class="card">

        <h2>Recent Expenses</h2>

        <table class="expense-table">

            <thead>

                <tr>

                    <th>Title</th>

                    <th>Amount</th>

                    <th>Category</th>

                    <th>Date</th>

                    <th>Action</th>

                </tr>

            </thead>


            <tbody id="expense-list">

            </tbody>

        </table>

    </div>


</div>


<script>


let categoryChart;

let monthlyChart;



async function loadDashboard() {


    const expenseResponse =
        await fetch("/api/expenses");


    const expenses =
        await expenseResponse.json();


    const list =
        document.getElementById(
            "expense-list"
        );


    list.innerHTML = "";


    expenses.forEach(expense => {


        const row =
            document.createElement("tr");


        row.innerHTML = `

            <td>${expense.title}</td>

            <td class="amount">
                ₹${expense.amount}
            </td>

            <td>

                <span class="category">
                    ${expense.category}
                </span>

            </td>

            <td>
                ${expense.expense_date}
            </td>

            <td>

                <button
                    class="delete-btn"
                    onclick="deleteExpense(${expense.id})"
                >
                    Delete
                </button>

            </td>

        `;


        list.appendChild(row);


    });


    const analyticsResponse =
        await fetch("/api/analytics");


    const analytics =
        await analyticsResponse.json();


    document.getElementById(
        "total-spending"
    ).textContent =
        `₹${analytics.total_spending}`;


    const expenseCount =
        expenses.length;


    const averageExpense =
        expenseCount > 0
            ? analytics.total_spending /
              expenseCount
            : 0;


    const highestExpense =
        expenseCount > 0
            ? Math.max(
                ...expenses.map(
                    expense =>
                        expense.amount
                )
            )
            : 0;


    const topCategory =
        analytics.by_category.length > 0
            ? analytics.by_category[0].category
            : "-";


    document.getElementById(
        "expense-count"
    ).textContent =
        expenseCount;


    document.getElementById(
        "average-expense"
    ).textContent =
        `₹${averageExpense.toFixed(2)}`;


    document.getElementById(
        "highest-expense"
    ).textContent =
        `₹${highestExpense}`;


    document.getElementById(
        "top-category"
    ).textContent =
        topCategory;



    /* Category Chart */


    const categories =
        analytics.by_category.map(
            item => item.category
        );


    const categoryTotals =
        analytics.by_category.map(
            item => item.total
        );


    if (categoryChart) {

        categoryChart.destroy();

    }


    categoryChart =
        new Chart(

            document.getElementById(
                "category-chart"
            ),

            {

                type: "doughnut",


                data: {

                    labels:
                        categories,

                    datasets: [

                        {

                            data:
                                categoryTotals,

                            borderWidth: 3,

                            borderColor:
                                "#ffffff"

                        }

                    ]

                },


                options: {

                    responsive: true,

                    maintainAspectRatio: false,

                    cutout: "65%",


                    plugins: {

                        legend: {

                            position:
                                "bottom",

                            labels: {

                                padding: 18,

                                usePointStyle:
                                    true

                            }

                        }

                    }

                }

            }

        );



    /* Monthly Chart */


    const months =
        analytics.by_month.map(
            item => item.month
        );


    const monthlyTotals =
        analytics.by_month.map(
            item => item.total
        );


    if (monthlyChart) {

        monthlyChart.destroy();

    }


    monthlyChart =
        new Chart(

            document.getElementById(
                "monthly-chart"
            ),

            {

                type: "bar",


                data: {

                    labels:
                        months,

                    datasets: [

                        {

                            label:
                                "Monthly Spending",

                            data:
                                monthlyTotals,

                            borderRadius:
                                8,

                            borderSkipped:
                                false

                        }

                    ]

                },


                options: {

                    responsive: true,

                    maintainAspectRatio: false,


                    plugins: {

                        legend: {

                            display:
                                false

                        }

                    },


                    scales: {

                        y: {

                            beginAtZero:
                                true,

                            grid: {

                                color:
                                    "rgba(148,163,184,0.15)"

                            }

                        },


                        x: {

                            grid: {

                                display:
                                    false

                            }

                        }

                    }

                }

            }

        );

}



async function deleteExpense(id) {


    await fetch(

        `/api/expenses/${id}`,

        {

            method:
                "DELETE"

        }

    );


    loadDashboard();

}



document.getElementById(
    "expense-form"
).addEventListener(

    "submit",

    async function(event) {


        event.preventDefault();


        const expense = {


            title:
                document.getElementById(
                    "title"
                ).value,


            amount:
                Number(
                    document.getElementById(
                        "amount"
                    ).value
                ),


            category:
                document.getElementById(
                    "category"
                ).value,


            expense_date:
                document.getElementById(
                    "expense-date"
                ).value

        };


        await fetch(

            "/api/expenses",

            {

                method:
                    "POST",


                headers: {

                    "Content-Type":
                        "application/json"

                },


                body:
                    JSON.stringify(
                        expense
                    )

            }

        );


        document.getElementById(
            "expense-form"
        ).reset();


        loadDashboard();


    }

);



loadDashboard();


</script>


</body>

</html>
